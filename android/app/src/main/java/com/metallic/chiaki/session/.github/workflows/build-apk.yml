name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the submodules the Android build needs
        run: |
          git submodule update --init \
            third-party/nanopb \
            third-party/jerasure \
            third-party/gf-complete \
            android/app/src/main/cpp/oboe

      # Same build image the Chiaki project uses for its own Android releases
      - name: Build debug APK
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/home/build/chiaki \
            -e GRADLE_USER_HOME=/home/build/chiaki/.gradle-home \
            thestr4ng3r/android:f064ea6 \
            /bin/bash -c "cd /home/build/chiaki/android && ./gradlew assembleDebug"

      - name: Fix file ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@v4
        with:
          name: chiaki-face-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
